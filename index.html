<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Medical Records System</title>
  <link rel="icon" type="image/png" href="/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet" />
</head>
<body class="bg-background text-on-surface font-body-md antialiased min-h-screen flex flex-col dark:bg-inverse-surface dark:text-inverse-on-surface">
  <div id="app">
    <div id="app-loading" style="display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:16px;background:#fff">
      <div style="width:48px;height:48px;border:4px solid #e0e0e0;border-top-color:#2563eb;border-radius:50%;animation:spin 0.8s linear infinite"></div>
      <p style="color:#64748b;font-family:system-ui,sans-serif;font-size:14px;margin:0">Loading application...</p>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
