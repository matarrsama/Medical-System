<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .dark .glass-panel {
            background: rgba(33, 49, 69, 0.85); /* inverse-surface base */
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>

<body class="bg-background text-on-background min-h-screen flex items-center justify-center relative overflow-hidden dark:bg-inverse-surface dark:text-inverse-on-surface">
<!-- Background Imagery/Pattern -->
<div class="absolute inset-0 z-0 bg-cover bg-center opacity-60 dark:opacity-30" data-alt="A macro shot of a sleek, modern server room corridor in a hospital IT facility. The image features rows of high-tech server racks illuminated by soft, cool blue and sterile white LED lights. The composition is highly symmetrical, emphasizing precision and reliability. The overall aesthetic is clinical, technological, and corporate modern, reflecting the rigorous environment of enterprise healthcare ICT management." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuANPLmvud6ArH30TzybHCC6lCHAhBVceD3FnBhntGNVM7LRhBmEOF9f4D6PKtNlUGhhEAuyOLuiMPHFZ66Auiq_PlLb67pjjJhHtgFQ35jdpviw1QG-7fC1wkU3NQ0j8wCaYLu8pihu8dlLrS-iloT35Y_kONZ2YwFnbSd4haPV16Lr44pfFlSHhZoIA1o6s6ZBla8pXgihIB9Jwv0-TULGDBMjSWxY9naIeDfMpkaWjYL-P0qNfBRFXpIjpzEq7gWwd7q8Vu8NQSg');">
</div>
<!-- Gradient Overlay for readability -->
<div class="absolute inset-0 z-0 bg-gradient-to-br from-surface-container-high/80 to-surface/90 dark:from-inverse-surface/90 dark:to-inverse-surface/95"></div>
<!-- Login Container -->
<div class="relative z-10 w-full max-w-md px-container-padding py-xl mx-auto flex flex-col gap-lg">
<!-- Brand Header -->
<div class="flex flex-col items-center text-center gap-sm mb-md">
<div class="w-16 h-16 rounded-lg bg-primary flex items-center justify-center shadow-sm mb-xs">
<span class="material-symbols-outlined text-on-primary text-display" style="font-size: 32px;">medical_services</span>
</div>
<h1 class="text-headline-lg font-headline-lg text-primary dark:text-inverse-primary">Medical Records System</h1>
<p class="text-body-md font-body-md text-on-surface-variant dark:text-outline">Enterprise Authentication Portal</p>
</div>
<!-- Login Card -->
<div class="glass-panel rounded-xl shadow-lg p-lg flex flex-col gap-lg">
<form class="flex flex-col gap-md" onsubmit="event.preventDefault(); window.location.hash='#/dashboard';">
<!-- Staff ID Field -->
<div class="flex flex-col gap-xs">
<label class="text-label-md font-label-md text-on-surface dark:text-inverse-on-surface" for="staff-id">Staff ID or Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">badge</span>
<input class="w-full pl-10 pr-3 py-2 bg-surface dark:bg-inverse-surface border border-outline-variant dark:border-outline rounded focus:ring-2 focus:ring-primary focus:border-primary text-body-md font-body-md text-on-surface dark:text-inverse-on-surface placeholder:text-outline-variant transition-colors outline-none h-10" id="staff-id" name="staff-id" placeholder="e.g. EMP-10294" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="text-label-md font-label-md text-on-surface dark:text-inverse-on-surface" for="password">Password</label>
<a class="text-label-sm font-label-sm text-primary dark:text-inverse-primary hover:underline" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">lock</span>
<input class="w-full pl-10 pr-10 py-2 bg-surface dark:bg-inverse-surface border border-outline-variant dark:border-outline rounded focus:ring-2 focus:ring-primary focus:border-primary text-body-md font-body-md text-on-surface dark:text-inverse-on-surface placeholder:text-outline-variant transition-colors outline-none h-10" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface dark:hover:text-inverse-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Primary Login Action -->
<button class="w-full h-10 bg-primary hover:bg-primary-container text-on-primary text-label-md font-label-md rounded flex items-center justify-center gap-xs transition-colors mt-sm shadow-sm" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[18px]">login</span>
</button>
</form>
<div class="flex items-center gap-sm">
<div class="flex-1 h-px bg-outline-variant dark:bg-outline opacity-50"></div>
<span class="text-label-sm font-label-sm text-outline">OR</span>
<div class="flex-1 h-px bg-outline-variant dark:bg-outline opacity-50"></div>
</div>
<!-- SSO / Secondary Actions -->
<button class="w-full h-10 bg-surface dark:bg-inverse-surface border border-outline-variant dark:border-outline hover:bg-surface-container-low dark:hover:bg-surface-variant text-on-surface dark:text-inverse-on-surface text-label-md font-label-md rounded flex items-center justify-center gap-sm transition-colors shadow-sm" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Continue with Google" onclick="window.location.hash='#/dashboard'
            </button>
</div>
<!-- Footer Footer -->
<div class="text-center">
<p class="text-body-sm font-body-sm text-outline-variant flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[16px]">verified_user</span>
                Secure Enterprise Connection
            </p>
</div>
</div>
<!-- Theme Toggle (Functional demo) -->
<button class="fixed bottom-4 right-4 w-10 h-10 rounded-full bg-surface-container border border-outline-variant flex items-center justify-center text-on-surface shadow-md hover:bg-surface-container-high transition-colors z-50" onclick="document.documentElement.classList.toggle('dark');">
<span class="material-symbols-outlined">contrast</span>
</button>
