<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>New Purchase Order</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#943700",
                        "surface-bright": "#f8f9ff",
                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#eaf1ff",
                        "surface-container-low": "#eff4ff",
                        "surface-container-highest": "#d3e4fe",
                        "on-tertiary": "#ffffff",
                        "surface-container": "#e5eeff",
                        "secondary": "#4b41e1",
                        "surface-variant": "#d3e4fe",
                        "secondary-fixed": "#e2dfff",
                        "on-primary-fixed-variant": "#003ea8",
                        "surface-container-high": "#dce9ff",
                        "secondary-container": "#645efb",
                        "outline": "#737686",
                        "tertiary-container": "#bc4800",
                        "surface": "#f8f9ff",
                        "error-container": "#ffdad6",
                        "on-surface-variant": "#434655",
                        "secondary-fixed-dim": "#c3c0ff",
                        "primary": "#004ac6",
                        "on-primary-fixed": "#00174b",
                        "inverse-surface": "#213145",
                        "on-error-container": "#93000a",
                        "surface-dim": "#cbdbf5",
                        "on-secondary-fixed": "#0f0069",
                        "on-surface": "#0b1c30",
                        "on-primary-container": "#eeefff",
                        "error": "#ba1a1a",
                        "on-secondary-fixed-variant": "#3323cc",
                        "background": "#f8f9ff",
                        "outline-variant": "#c3c6d7",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-primary": "#ffffff",
                        "on-secondary-container": "#fffbff",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "on-tertiary-fixed": "#360f00",
                        "surface-tint": "#0053db",
                        "surface-container-lowest": "#ffffff",
                        "inverse-primary": "#b4c5ff",
                        "on-tertiary-container": "#ffede6",
                        "tertiary-fixed-dim": "#ffb596",
                        "on-error": "#ffffff",
                        "on-background": "#0b1c30",
                        "primary-container": "#2563eb",
                        "primary-fixed": "#dbe1ff",
                        "tertiary-fixed": "#ffdbcd"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "lg": "24px",
                        "xl": "32px",
                        "md": "16px",
                        "xs": "4px",
                        "container-padding": "24px",
                        "gutter": "16px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "body-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "display": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg": ["Inter"]
                    },
                    "fontSize": {
                        "label-sm": ["11px", { "lineHeight": "14px", "fontWeight": "500" }],
                        "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex items-center justify-center p-md sm:p-lg">
<!-- Modal Backdrop -->
<div class="fixed inset-0 bg-inverse-surface/40 backdrop-blur-sm z-40 transition-opacity"></div>
<!-- Modal Container -->
<div class="relative bg-surface-container-lowest rounded-xl shadow-2xl w-full max-w-4xl max-h-[921px] flex flex-col z-50 border border-outline-variant overflow-hidden">
<!-- Header -->
<div class="flex items-center justify-between px-lg py-md border-b border-outline-variant bg-surface-container-lowest sticky top-0 z-10">
<div>
<h2 class="text-headline-md font-headline-md text-on-surface">New Purchase Order</h2>
<p class="text-body-sm font-body-sm text-on-surface-variant mt-xs">Drafting PO-2023-4091 for procurement.</p>
</div>
<button class="text-on-surface-variant hover:bg-surface-container-low rounded-full p-2 transition-colors" onclick="closeModal()">
<span class="material-symbols-outlined block">close</span>
</button>
</div>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto p-lg bg-surface-container-lowest">
<form class="space-y-xl" id="po-form">
<!-- Vendor & Basic Details Section -->
<section class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="space-y-xs">
<label class="text-label-md font-label-md text-on-surface-variant uppercase" for="vendor">Vendor</label>
<select class="w-full h-10 px-sm border border-outline-variant rounded-md bg-surface-bright text-body-md font-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary appearance-none" id="vendor">
<option value="">Select a vendor...</option>
<option value="v1">Dell Technologies</option>
<option value="v2">Cisco Systems</option>
<option value="v3">Medline Industries</option>
</select>
</div>
<div class="space-y-xs">
<label class="text-label-md font-label-md text-on-surface-variant uppercase" for="expected_date">Expected Delivery</label>
<input class="w-full h-10 px-sm border border-outline-variant rounded-md bg-surface-bright text-body-md font-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary" id="expected_date" type="date"/>
</div>
</section>
<!-- Line Items Section -->
<section class="space-y-sm">
<div class="flex items-center justify-between">
<h3 class="text-headline-md font-headline-md text-on-surface text-base">Line Items</h3>
<button class="text-primary hover:bg-primary-fixed-dim/20 px-sm py-xs rounded-md text-label-md font-label-md transition-colors flex items-center gap-xs" type="button">
<span class="material-symbols-outlined text-[18px]">add</span> Add Item
                        </button>
</div>
<div class="border border-outline-variant rounded-lg overflow-hidden bg-surface-container-lowest">
<table class="w-full text-left border-collapse">
<thead class="bg-surface-container-low border-b border-outline-variant">
<tr>
<th class="py-sm px-md text-label-md font-label-md text-on-surface-variant uppercase w-1/2">Description</th>
<th class="py-sm px-md text-label-md font-label-md text-on-surface-variant uppercase w-24">Qty</th>
<th class="py-sm px-md text-label-md font-label-md text-on-surface-variant uppercase w-32">Unit Price ($)</th>
<th class="py-sm px-md text-label-md font-label-md text-on-surface-variant uppercase text-right">Total</th>
<th class="py-sm px-sm w-10"></th>
</tr>
</thead>
<tbody class="divide-y divide-outline-variant">
<!-- Row 1 -->
<tr class="hover:bg-surface-bright transition-colors group">
<td class="p-xs px-md">
<input class="w-full h-8 px-xs border-transparent bg-transparent hover:border-outline-variant focus:border-primary focus:bg-surface-bright rounded text-body-md font-body-md" type="text" value="Dell OptiPlex 7000 Micro Form Factor"/>
</td>
<td class="p-xs px-md">
<input class="w-full h-8 px-xs border-transparent bg-transparent hover:border-outline-variant focus:border-primary focus:bg-surface-bright rounded text-body-md font-body-md text-center" type="number" value="5"/>
</td>
<td class="p-xs px-md">
<input class="w-full h-8 px-xs border-transparent bg-transparent hover:border-outline-variant focus:border-primary focus:bg-surface-bright rounded text-body-md font-body-md text-right" step="0.01" type="number" value="850.00"/>
</td>
<td class="p-xs px-md text-right text-body-md font-body-md text-on-surface">
                                        4,250.00
                                    </td>
<td class="p-xs text-center">
<button class="text-outline hover:text-error opacity-0 group-hover:opacity-100 transition-opacity p-1" type="button">
<span class="material-symbols-outlined text-[18px] block">delete</span>
</button>
</td>
</tr>
<!-- Row 2 -->
<tr class="hover:bg-surface-bright transition-colors group bg-surface-bright/50">
<td class="p-xs px-md">
<input class="w-full h-8 px-xs border-transparent bg-transparent hover:border-outline-variant focus:border-primary focus:bg-surface-bright rounded text-body-md font-body-md" type="text" value="Cisco Catalyst 9200L 48-port PoE+"/>
</td>
<td class="p-xs px-md">
<input class="w-full h-8 px-xs border-transparent bg-transparent hover:border-outline-variant focus:border-primary focus:bg-surface-bright rounded text-body-md font-body-md text-center" type="number" value="2"/>
</td>
<td class="p-xs px-md">
<input class="w-full h-8 px-xs border-transparent bg-transparent hover:border-outline-variant focus:border-primary focus:bg-surface-bright rounded text-body-md font-body-md text-right" step="0.01" type="number" value="1200.50"/>
</td>
<td class="p-xs px-md text-right text-body-md font-body-md text-on-surface">
                                        2,401.00
                                    </td>
<td class="p-xs text-center">
<button class="text-outline hover:text-error opacity-0 group-hover:opacity-100 transition-opacity p-1" type="button">
<span class="material-symbols-outlined text-[18px] block">delete</span>
</button>
</td>
</tr>
</tbody>
</table>
</div>
</section>
<!-- Logistics & Financials Flex Section -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-lg pt-md">
<!-- Logistics (Shipping & Billing) -->
<div class="space-y-md">
<div class="space-y-xs">
<label class="text-label-md font-label-md text-on-surface-variant uppercase" for="shipping_address">Shipping Address</label>
<textarea class="w-full p-sm border border-outline-variant rounded-md bg-surface-bright text-body-sm font-body-sm text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary resize-none" id="shipping_address" rows="3">Main Hospital Campus - IT Receiving
123 Medical Center Blvd, Loading Dock B
Cityville, ST 12345</textarea>
</div>
<div class="space-y-xs">
<label class="text-label-md font-label-md text-on-surface-variant uppercase" for="billing_terms">Billing Terms</label>
<select class="w-full h-10 px-sm border border-outline-variant rounded-md bg-surface-bright text-body-sm font-body-sm text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary appearance-none" id="billing_terms">
<option value="net30">Net 30</option>
<option value="net60">Net 60</option>
<option value="due_receipt">Due on Receipt</option>
</select>
</div>
</div>
<!-- Totals Calculation -->
<div class="bg-surface-container rounded-lg p-md flex flex-col justify-end border border-outline-variant/50">
<div class="space-y-sm">
<div class="flex justify-between items-center text-body-md font-body-md text-on-surface-variant">
<span>Subtotal</span>
<span>$6,651.00</span>
</div>
<div class="flex justify-between items-center text-body-md font-body-md text-on-surface-variant">
<span>Tax (8.5%)</span>
<span>$565.34</span>
</div>
<div class="flex justify-between items-center text-body-md font-body-md text-on-surface-variant">
<span>Shipping &amp; Handling</span>
<span>$45.00</span>
</div>
<div class="pt-sm border-t border-outline-variant flex justify-between items-center text-headline-md font-headline-md text-on-surface">
<span>Grand Total</span>
<span>$7,261.34</span>
</div>
</div>
</div>
</div>
</form>
</div>
<!-- Footer Actions -->
<div class="px-lg py-md border-t border-outline-variant bg-surface-container-low flex justify-end gap-sm sticky bottom-0 z-10 rounded-b-xl">
<button class="px-md py-sm rounded border border-outline text-on-surface font-label-md text-label-md hover:bg-surface-container-highest transition-colors" type="button" onclick="closeModal()">
                Cancel
            </button>
<button class="px-md py-sm rounded bg-surface text-primary border border-outline-variant font-label-md text-label-md hover:bg-surface-bright transition-colors" type="button">
                Save Draft
            </button>
<button class="px-md py-sm rounded bg-primary text-on-primary font-label-md text-label-md hover:bg-primary/90 transition-colors shadow-sm" form="po-form" type="submit">
                Submit Order
            </button>
</div>
</div>
</body></html>
