<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add User Modal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#943700",
                        "surface-bright": "#f8f9ff",
                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#eaf1ff",
                        "surface-container-low": "#eff4ff",
                        "surface-container-highest": "#d3e4fe",
                        "on-tertiary": "#ffffff",
                        "surface-container": "#e5eeff",
                        "secondary": "#4b41e1",
                        "surface-variant": "#d3e4fe",
                        "secondary-fixed": "#e2dfff",
                        "on-primary-fixed-variant": "#003ea8",
                        "surface-container-high": "#dce9ff",
                        "secondary-container": "#645efb",
                        "outline": "#737686",
                        "tertiary-container": "#bc4800",
                        "surface": "#f8f9ff",
                        "error-container": "#ffdad6",
                        "on-surface-variant": "#434655",
                        "secondary-fixed-dim": "#c3c0ff",
                        "primary": "#004ac6",
                        "on-primary-fixed": "#00174b",
                        "inverse-surface": "#213145",
                        "on-error-container": "#93000a",
                        "surface-dim": "#cbdbf5",
                        "on-secondary-fixed": "#0f0069",
                        "on-surface": "#0b1c30",
                        "on-primary-container": "#eeefff",
                        "error": "#ba1a1a",
                        "on-secondary-fixed-variant": "#3323cc",
                        "background": "#f8f9ff",
                        "outline-variant": "#c3c6d7",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-primary": "#ffffff",
                        "on-secondary-container": "#fffbff",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "on-tertiary-fixed": "#360f00",
                        "surface-tint": "#0053db",
                        "surface-container-lowest": "#ffffff",
                        "inverse-primary": "#b4c5ff",
                        "on-tertiary-container": "#ffede6",
                        "tertiary-fixed-dim": "#ffb596",
                        "on-error": "#ffffff",
                        "on-background": "#0b1c30",
                        "primary-container": "#2563eb",
                        "primary-fixed": "#dbe1ff",
                        "tertiary-fixed": "#ffdbcd"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "lg": "24px",
                        "xl": "32px",
                        "md": "16px",
                        "xs": "4px",
                        "container-padding": "24px",
                        "gutter": "16px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "body-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "display": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg": ["Inter"]
                    },
                    "fontSize": {
                        "label-sm": ["11px", { "lineHeight": "14px", "fontWeight": "500" }],
                        "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface-container h-screen w-screen flex items-center justify-center p-md font-body-md text-on-surface">
<!-- Modal Backdrop -->
<div class="fixed inset-0 bg-inverse-surface/40 backdrop-blur-sm z-40 transition-opacity"></div>
<!-- Modal Container -->
<div class="relative bg-surface-container-lowest rounded-xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] w-full max-w-[600px] z-50 overflow-hidden flex flex-col border border-outline-variant">
<!-- Header -->
<div class="flex items-center justify-between px-lg py-md border-b border-outline-variant bg-surface-bright">
<h2 class="font-headline-md text-headline-md text-on-surface flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" data-icon="person_add">person_add</span>
                Add New User
            </h2>
<button class="text-on-surface-variant hover:text-on-surface hover:bg-surface-container-low p-xs rounded-full transition-colors" onclick="closeModal()">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Body / Form -->
<div class="p-lg overflow-y-auto max-h-[716px]">
<form class="grid grid-cols-1 md:grid-cols-2 gap-x-md gap-y-lg">
<!-- Full Name -->
<div class="col-span-1 md:col-span-2">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="fullName">Full Name</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded text-on-surface focus:bg-surface-bright focus:border-primary focus:ring-1 focus:ring-primary h-10 px-md transition-colors" id="fullName" placeholder="e.g. Dr. Sarah Jenkins" type="text"/>
</div>
<!-- Staff ID -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="staffId">Staff ID</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded text-on-surface focus:bg-surface-bright focus:border-primary focus:ring-1 focus:ring-primary h-10 px-md transition-colors" id="staffId" placeholder="e.g. MED-8492" type="text"/>
</div>
<!-- Email -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="email">Email Address</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded text-on-surface focus:bg-surface-bright focus:border-primary focus:ring-1 focus:ring-primary h-10 px-md transition-colors" id="email" placeholder="sarah.j@hospital.org" type="email"/>
</div>
<!-- Department -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="department">Department</label>
<div class="relative">
<select class="w-full bg-surface-container-low border border-outline-variant rounded text-on-surface focus:bg-surface-bright focus:border-primary focus:ring-1 focus:ring-primary h-10 px-md appearance-none transition-colors" id="department">
<option disabled="" selected="" value="">Select Department</option>
<option value="emergency">Emergency</option>
<option value="cardiology">Cardiology</option>
<option value="neurology">Neurology</option>
<option value="ict">ICT Services</option>
<option value="admin">Administration</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Role -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="role">Primary Role</label>
<div class="relative">
<select class="w-full bg-surface-container-low border border-outline-variant rounded text-on-surface focus:bg-surface-bright focus:border-primary focus:ring-1 focus:ring-primary h-10 px-md appearance-none transition-colors" id="role">
<option disabled="" selected="" value="">Select Role</option>
<option value="physician">Attending Physician</option>
<option value="nurse">Registered Nurse</option>
<option value="technician">IT Technician</option>
<option value="manager">Department Manager</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Permission Level -->
<div class="col-span-1 md:col-span-2">
<label class="block font-label-md text-label-md text-on-surface-variant mb-sm">System Access Level</label>
<div class="grid grid-cols-1 sm:grid-cols-3 gap-sm">
<label class="relative flex items-start p-sm border border-outline-variant rounded cursor-pointer hover:bg-surface-container-low transition-colors has-[:checked]:bg-primary-container/10 has-[:checked]:border-primary">
<input checked="" class="peer sr-only" name="accessLevel" type="radio" value="standard"/>
<span class="material-symbols-outlined text-on-surface-variant peer-checked:text-primary mt-0.5 mr-xs" data-icon="radio_button_checked">radio_button_unchecked</span>
<div>
<span class="block font-body-sm text-body-sm text-on-surface font-medium">Standard</span>
<span class="block font-label-sm text-label-sm text-on-surface-variant mt-0.5">Basic clinical tools</span>
</div>
</label>
<label class="relative flex items-start p-sm border border-outline-variant rounded cursor-pointer hover:bg-surface-container-low transition-colors has-[:checked]:bg-primary-container/10 has-[:checked]:border-primary">
<input class="peer sr-only" name="accessLevel" type="radio" value="elevated"/>
<span class="material-symbols-outlined text-on-surface-variant peer-checked:text-primary mt-0.5 mr-xs" data-icon="radio_button_unchecked">radio_button_unchecked</span>
<div>
<span class="block font-body-sm text-body-sm text-on-surface font-medium">Elevated</span>
<span class="block font-label-sm text-label-sm text-on-surface-variant mt-0.5">Dept. management</span>
</div>
</label>
<label class="relative flex items-start p-sm border border-outline-variant rounded cursor-pointer hover:bg-surface-container-low transition-colors has-[:checked]:bg-primary-container/10 has-[:checked]:border-primary">
<input class="peer sr-only" name="accessLevel" type="radio" value="admin"/>
<span class="material-symbols-outlined text-on-surface-variant peer-checked:text-primary mt-0.5 mr-xs" data-icon="radio_button_unchecked">radio_button_unchecked</span>
<div>
<span class="block font-body-sm text-body-sm text-on-surface font-medium">Administrator</span>
<span class="block font-label-sm text-label-sm text-on-surface-variant mt-0.5">Full system access</span>
</div>
</label>
</div>
</div>
<!-- Password Reset Toggle -->
<div class="col-span-1 md:col-span-2 pt-sm border-t border-outline-variant">
<label class="flex items-center justify-between cursor-pointer">
<div>
<span class="block font-body-md text-body-md text-on-surface font-medium">Require Password Reset</span>
<span class="block font-body-sm text-body-sm text-on-surface-variant mt-xs">User must change their temporary password upon first login.</span>
</div>
<div class="relative inline-flex items-center">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-primary rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-outline after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</div>
</label>
</div>
</form>
</div>
<!-- Footer Actions -->
<div class="flex items-center justify-end px-lg py-md border-t border-outline-variant bg-surface-bright gap-sm">
<button class="px-md py-sm rounded font-label-md text-label-md text-on-surface border border-outline-variant bg-surface hover:bg-surface-container-low transition-colors" onclick="closeModal()">
                Cancel
            </button>
<button class="px-md py-sm rounded font-label-md text-label-md text-on-primary bg-primary hover:bg-primary/90 transition-colors flex items-center gap-xs">
<span class="material-symbols-outlined text-[18px]" data-icon="save">save</span>
                Create User
            </button>
</div>
</div>
<script>
        // Simple JS for radio button icon toggling (visual only for the demo)
        document.querySelectorAll('input[name="accessLevel"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                document.querySelectorAll('input[name="accessLevel"]').forEach(r => {
                    const icon = r.nextElementSibling;
                    if(r.checked) {
                        icon.textContent = 'radio_button_checked';
                    } else {
                        icon.textContent = 'radio_button_unchecked';
                    }
                });
            });
        });
    </script>
</body></html>
